<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programas Académicos — Mockup navegable</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login" class="login">
  <div class="login-hero">
    <div>
      <h1>Programas Académicos</h1>
      <p>Gestión y seguimiento del ciclo de vida de los programas académicos.</p>
    </div>
  </div>
  <div class="login-box">
    <div class="login-card">
      <img src="https://economicas.uba.ar/wp-content/uploads/Logo_economicas.png" alt="Facultad de Ciencias Económicas – UBA" style="height:52px;display:block;margin-bottom:22px">
      <h2>Iniciar sesión</h2>
      <p>Ingresá para acceder a tus programas y tareas pendientes.</p>
      <label>Usuario</label>
      <input id="loginUser" placeholder="Ingrese su usuario">
      <label>Contraseña</label>
      <input id="loginPass" type="password" placeholder="Ingrese su contraseña">
      <button class="btn primary" onclick="enterApp()">Ingresar</button>
      <p style="text-align:center;margin-top:16px;font-size:12px"><a href="#">¿Olvidó su contraseña?</a></p>
    </div>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <div class="topbar-brand">
      <img src="https://economicas.uba.ar/wp-content/uploads/Logo_economicas.png" alt="Facultad de Ciencias Económicas – UBA">
      <div class="brand-text">Programas Académicos<small>Gestión de programas</small></div>
    </div>
    <nav class="nav">
      <button data-screen="dashboard" class="active">Inicio</button>
      <button data-screen="programs">Programas</button>
      <button data-screen="tasks">Tareas<span class="campana" id="campanaTareas" title="Hay tareas pendientes" aria-label="Hay tareas pendientes" hidden><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-6v-5a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2z"/></svg></span></button>
      <button data-screen="notifications">Notificaciones<span class="campana" id="campanaNotificaciones" title="Hay notificaciones nuevas" aria-label="Hay notificaciones nuevas" hidden><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-6v-5a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2z"/></svg></span></button>
      <button data-screen="profile">Perfil</button>
    </nav>
    <div class="role">Rol: <select id="roleSelect" onchange="changeRole(this.value)">
      <option value="TITULAR_CATEDRA">Titular de cátedra</option>
      <option value="SUBSECRETARIA_1">Subsecretaría_1 (Métodos)</option>
      <option value="SUBSECRETARIA_2">Subsecretaría_2 (Bibliografía)</option>
      <option value="DIRECCION_ACADEMICA">Dirección Académica</option>
      <option value="DIRECTOR_DEPARTAMENTO">Director/a de Departamento</option>
    </select></div>
  </header>
  <main class="main">
    <section id="content" class="content"></section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
